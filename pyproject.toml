[project]
name = "adguard-dns-query-analyzer"
version = "0.1.0"
description = "Dashboard and detections over AdGuard Home query logs (FastAPI + DuckDB)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "pytz>=2026.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Timestamps are the operator's local time by design: log dates are bucketed
# in the system timezone.
"*.py" = ["DTZ005"]
